name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run format
      - run: npm run lint
      - name: Check component codegen freshness
        env:
          CONVEX_AGENT_MODE: anonymous
          CONVEX_DISABLE_SENTRY: "1"
        run: |
          npx convex dev --once --typecheck-components
          npm run check:codegen
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:race
      - run: npm run test:coverage
      - run: npm run build
      - name: Inspect alpha tarball exports and file list
        run: npm run release:prepare
      - name: Packed clean-consumer, codegen, query, mutation, and reactivity
        env:
          npm_config_registry: https://registry.npmjs.org/
        run: npm run test:consumer
      - name: Confirm alpha publication remains gated
        run: node scripts/check-release.mjs --config-only
