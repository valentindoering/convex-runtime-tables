name: Nightly deployment gates

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: read

concurrency:
  group: runtime-tables-deployment-gates
  cancel-in-progress: false

jobs:
  deployment-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
      CONVEX_HOSTED_GATE: "1"
      CONVEX_TEST_URL: ${{ vars.CONVEX_TEST_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Require the isolated development deployment key
        run: test -n "$CONVEX_DEPLOY_KEY" && test -n "$CONVEX_TEST_URL"
      - name: Packed consumer and genuine two-client reactivity
        run: npm run test:consumer
      - name: 100k concurrent-write scale and oracle suite
        run: npm run test:scale
